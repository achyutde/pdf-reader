<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>PDF Reader</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <h1>📖 PDF Reader <span id="app-version">v2.3.2</span></h1>
  <button class="top-btn">Open PDF</button>
  <button class="top-btn sec" id="bm-btn"    disabled>🔖 Bookmarks</button>
  <button class="top-btn sec" id="saveb"     disabled>🔖 Save</button>
  <button class="top-btn sec" id="annotate-btn" disabled>✏️ Annotate</button>
  <button class="top-btn sec" id="view-btn"  disabled>↔ Fit Width</button>
  <button class="top-btn sec" id="focus-btn" disabled>⛶ Focus</button>
  <input type="file" id="file-input" accept="application/pdf" />
  <div id="page-jump">
    <label for="pg-select">Page</label>
    <select id="pg-select" aria-label="Go to page" disabled>
      <option value="">—</option>
    </select>
    <span id="page-total">of —</span>
  </div>
</div>

<!-- Resume banner -->
<div id="resume-bar">
  <p id="resume-msg">Resume where you left off?</p>
  <button class="rb-btn" id="rb-yes">Resume</button>
  <button class="rb-btn" id="rb-no">Start fresh</button>
</div>

<!-- Exit focus FAB (top-right) -->
<button id="fab" title="Exit focus mode">⊟</button>

<!-- Play/Pause FAB (bottom-right, focus mode) -->
<button id="fab-play" title="Play / Pause">▶</button>

<!-- Edge page nav buttons (focus mode) -->
<button class="edge-btn" id="edge-prev" title="Previous page">◀</button>
<button class="edge-btn" id="edge-next" title="Next page">▶</button>

<!-- Return-to-reading-position pill (appears when display page ≠ TTS page) -->
<button id="return-btn" title="Return to reading position">↩ p.1</button>

<!-- Tap-to-position confirmation popup -->
<div id="tap-menu">
  <div id="tap-preview"></div>
  <div id="tap-actions">
    <button id="tap-read">▶ Read from here</button>
    <button id="tap-cancel">✕</button>
  </div>
</div>

<!-- Scrollable content -->
<div id="content">
  <div id="drop-zone">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
    </svg>
    <p>Tap <strong>Open PDF</strong> above<br/>to load a file from your Files app</p>
  </div>

  <div id="canvas-wrap">
    <div id="canvas-container">
      <canvas id="pdf-canvas"></canvas>
      <canvas id="annotation-canvas"></canvas>
      <canvas id="hl-canvas"></canvas>
    </div>
    <div id="tap-hint">👆 Tap a word to read · Swipe horizontally to change page</div>
  </div>
</div>

<!-- Annotation tools -->
<div id="annotation-toolbar" role="toolbar" aria-label="PDF annotation tools" aria-hidden="true">
  <button class="ann-tool active" data-tool="move" title="Move and scroll">↕ Move</button>
  <button class="ann-tool" data-tool="highlight" title="Yellow highlighter">🖍 Highlight</button>
  <button class="ann-tool" data-tool="pen" title="Red pen">✏ Pen</button>
  <button class="ann-tool" data-tool="eraser" title="Erase marks">⌫ Erase</button>
  <button class="ann-action" id="ann-undo" title="Undo annotation">↶ Undo</button>
  <button class="ann-action danger" id="ann-clear" title="Clear annotations on this page">Clear page</button>
</div>

<!-- Sentence ticker -->
<div id="ticker"></div>

<!-- Reading progress (stays visible in focus mode) -->
<div id="reading-progress" role="progressbar" aria-label="PDF reading progress"
     aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div id="progress-meta">
    <span id="progress-percent">0%</span>
    <span id="progress-remaining">Calculating…</span>
  </div>
  <div id="progress-track"><div id="progress-fill"></div></div>
</div>

<!-- Controls -->
<div id="controls">
  <div class="ctrl-row">
    <button class="cb" id="prev-pg"   disabled>◀ Page</button>
    <button class="cb" id="prev-sent" disabled>⏮</button>
    <button class="cb" id="playb"     disabled>▶ Read</button>
    <button class="cb" id="next-sent" disabled>⏭</button>
    <button class="cb" id="next-pg"   disabled>Page ▶</button>
  </div>
  <div class="ctrl-row">
    <label id="speed-lbl" for="speed-select">Speed</label>
    <select id="speed-select" aria-label="Reading speed">
      <option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option>
      <option value="1" selected>1.0×</option>
      <option value="1.1">1.1×</option>
      <option value="1.2">1.2×</option>
      <option value="1.3">1.3×</option>
      <option value="1.4">1.4×</option>
      <option value="1.5">1.5×</option>
      <option value="1.6">1.6×</option>
      <option value="1.7">1.7×</option>
      <option value="1.8">1.8×</option>
      <option value="1.9">1.9×</option>
      <option value="2">2.0×</option>
      <option value="2.5">2.5×</option>
      <option value="3">3.0×</option>
      <option value="3.5">3.5×</option>
      <option value="4">4.0×</option>
    </select>
    <select id="voice-sel">
      <option value="">Default Voice</option>
    </select>
  </div>
</div>

<!-- Bookmarks sheet -->
<div id="bm-bg">
  <div id="bm-sheet">
    <div id="bm-head">
      <h2>🔖 Bookmarks</h2>
      <button class="bm-io-btn" id="bm-import-btn" title="Import bookmarks and annotations">⬆ Import</button>
      <button class="bm-io-btn" id="bm-export-btn" title="Export bookmarks and annotations">⬇ Export</button>
      <input type="file" id="bm-import-input" accept="application/json" style="display:none" />
      <button id="bm-x">✕</button>
    </div>
    <div id="bm-items"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script type="module" src="js/main.js?v=2.3.2"></script>
</body>
</html>
